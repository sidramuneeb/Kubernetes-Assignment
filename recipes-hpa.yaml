apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recipes-hpa
  namespace: recipe-app
  labels:
    app: recipes-service
    app.kubernetes.io/name: recipes-hpa
    app.kubernetes.io/part-of: recipe-collection-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recipes-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
