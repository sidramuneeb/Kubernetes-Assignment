apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingredients-deployment
  namespace: recipe-app
  labels:
    app: ingredients-service
    app.kubernetes.io/name: ingredients-service
    app.kubernetes.io/part-of: recipe-collection-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingredients-service
  template:
    metadata:
      labels:
        app: ingredients-service
    spec:
      containers:
        - name: ingredients-service
          image: username/ingredients-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          env:
            - name: PORT
              value: "5002"
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: DEBUG
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: INGREDIENTS_DB_NAME
            - name: RECIPES_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: RECIPES_SERVICE_URL
            - name: REQUEST_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: recipe-app-config
                  key: REQUEST_TIMEOUT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
