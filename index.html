<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fa-solid fa-bowl-food me-2 text-warning"></i>Recipe App
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="/">Recipes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/apidocs/" target="_blank">
              <i class="fa-solid fa-code me-1"></i>API Docs
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center text-light small">
          <span id="serviceStatus" class="me-3">
            <span class="status-dot"></span>Service: Online
          </span>
          <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
            <i class="fa-solid fa-plus me-1"></i>Add Recipe
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container py-4">

    <!-- Search & Filter Controls -->
    <div class="row g-2 mb-4 align-items-center">
      <div class="col-md-5 col-12">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
          <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search recipes by name or description...">
        </div>
      </div>
      <div class="col-md-3 col-8">
        <select id="categorySelect" class="form-select">
          <option value="">All Categories</option>
          <option value="Italian">Italian</option>
          <option value="Mexican">Mexican</option>
          <option value="Asian">Asian</option>
          <option value="Mediterranean">Mediterranean</option>
          <option value="American">American</option>
          <option value="Dessert">Dessert</option>
        </select>
      </div>
      <div class="col-md-4 col-4 text-end">
        <button class="btn btn-outline-secondary" onclick="loadRecipes()">
          <i class="fa-solid fa-arrows-rotate me-1"></i>Reload
        </button>
      </div>
    </div>

    <!-- Recipe Cards Grid -->
    <div id="recipeContainer" class="row g-3">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm text-secondary me-2"></div>Loading recipes...
      </div>
    </div>

  </div>

  <!-- Recipe Details Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <span id="detailCategory" class="badge-cat small me-2">Category</span>
            <h5 id="detailName" class="modal-title d-inline-block fw-bold">Recipe Name</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p id="detailDesc" class="text-secondary mb-3"></p>

          <div class="d-flex gap-3 meta-box mb-4">
            <div><strong>Prep:</strong> <span id="detailPrep">0</span> min</div>
            <div><strong>Cook:</strong> <span id="detailCook">0</span> min</div>
            <div><strong>Servings:</strong> <span id="detailServings">1</span></div>
          </div>

          <!-- Ingredients List -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold mb-0">Ingredients</h6>
              <button class="btn btn-sm btn-outline-primary" id="toggleIngBtn">
                <i class="fa-solid fa-plus me-1"></i>Add
              </button>
            </div>

            <!-- Inline Add Ingredient Form -->
            <div id="ingFormBox" class="meta-box mb-3 d-none">
              <div class="row g-2">
                <div class="col-md-5">
                  <input type="text" id="ingName" class="form-control form-control-sm" placeholder="Ingredient (e.g. Flour)">
                </div>
                <div class="col-md-3">
                  <input type="number" step="any" id="ingQty" class="form-control form-control-sm" placeholder="Qty (e.g. 250)">
                </div>
                <div class="col-md-2">
                  <input type="text" id="ingUnit" class="form-control form-control-sm" placeholder="Unit (g, cups)">
                </div>
                <div class="col-md-2">
                  <button class="btn btn-sm btn-success w-100" onclick="saveIngredient()">Save</button>
                </div>
              </div>
            </div>

            <ul id="ingredientList" class="list-group list-group-flush border rounded-2"></ul>
          </div>

          <!-- Instructions -->
          <div>
            <h6 class="fw-bold mb-2">Instructions</h6>
            <div id="detailInstructions" class="p-3 bg-light rounded-2 text-dark" style="white-space: pre-line; line-height: 1.6;"></div>
          </div>
        </div>

        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-danger btn-sm" id="deleteRecipeBtn">
            <i class="fa-solid fa-trash me-1"></i>Delete Recipe
          </button>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Recipe Modal -->
  <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">New Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="recipeForm" onsubmit="handleCreateRecipe(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Recipe Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="newName" required placeholder="e.g. Homemade Tacos">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Category <span class="text-danger">*</span></label>
                <select class="form-select" id="newCategory" required>
                  <option value="Italian">Italian</option>
                  <option value="Mexican">Mexican</option>
                  <option value="Asian">Asian</option>
                  <option value="Mediterranean">Mediterranean</option>
                  <option value="American">American</option>
                  <option value="Dessert">Dessert</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">Prep (min)</label>
                <input type="number" class="form-control" id="newPrep" value="15" min="0">
              </div>
              <div class="col-md-2">
                <label class="form-label">Cook (min)</label>
                <input type="number" class="form-control" id="newCook" value="20" min="0">
              </div>
              <div class="col-md-2">
                <label class="form-label">Servings</label>
                <input type="number" class="form-control" id="newServings" value="4" min="1">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" id="newDesc" placeholder="Brief summary of the recipe">
            </div>

            <div class="mb-3">
              <label class="form-label">Instructions <span class="text-danger">*</span></label>
              <textarea class="form-control" id="newInstructions" rows="5" required placeholder="Step-by-step cooking steps..."></textarea>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Save Recipe</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
